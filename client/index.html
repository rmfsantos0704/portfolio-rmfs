<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Russel Santos — full-stack developer building reliable web and mobile experiences."
    />
    <title>Russel Santos — Full-stack Developer</title>
    <script>
      // Set the theme before first paint to avoid a flash. Saved choice wins,
      // otherwise follow the visitor's OS preference.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
